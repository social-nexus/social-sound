name: Social Sound CI
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
concurrency:
  group: social-sound-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install test dependencies
        run: python -m pip install pytest fastapi httpx numpy soundfile "keyring>=25.5,<26" python-multipart
      - name: Compile Python sources
        run: python -m compileall -q server
      - name: Test AI modules
        run: pytest -q tests
      - name: Check shell script syntax
        run: bash -n config.sh iniciar-linux.sh instalar-linux.sh
      - name: Build packaged React frontend
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build
      - name: Upload packaged frontend build
        uses: actions/upload-artifact@v4
        with:
          name: social-sound-web-dist
          path: |
            server/web
            web/package-lock.json
      - name: Commit generated frontend package files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain server/web web/package-lock.json)" ]; then
            git add server/web web/package-lock.json
            git commit -m "build: refresh packaged frontend assets"
            if ! git push; then
              echo "AVISO: a branch mudou durante o build. Os assets serao atualizados pelo proximo CI da branch."
            fi
          fi
      - name: Check JavaScript syntax
        run: node --check server/ai_web/app.js && node --check server/narracoes/app.js
