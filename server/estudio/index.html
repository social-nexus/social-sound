<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Social Sound</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png">
<style>
  :root { color-scheme: dark; --bar:#111827; --ink:#F8FAFC; --muted:#94A3B8; --accent:#7C3AED; --accent2:#2563EB; --bg:#080D1D; --line:rgba(148,163,184,.16); }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); font-family: system-ui, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 22px; height: 44px; padding: 0 14px; background: var(--bar); flex-shrink: 0; border-bottom: 1px solid var(--line); }
  .brand { font-weight: 900; letter-spacing: -.02em; font-size: 15px; color: #fff; white-space: nowrap; }
  .brand span { background: linear-gradient(90deg, #8B5CF6, var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .brand .logo { height: 32px; width: 32px; vertical-align: middle; margin-right: 8px; background: #fff; border-radius: 8px; padding: 2px; }
  nav { display: flex; gap: 4px; height: 100%; align-items: flex-end; }
  nav button { appearance: none; border: 0; background: transparent; color: var(--muted); font: 600 13px system-ui, sans-serif;
    padding: 0 16px; height: 34px; border-radius: 8px 8px 0 0; cursor: pointer; }
  nav button:hover { color: #fff; }
  nav button.on { background: var(--bg); color: var(--ink); box-shadow: inset 0 2px 0 var(--accent); }
  .hint { margin-left: auto; color: var(--muted); font-size: 11px; }
  main { flex: 1; position: relative; min-height: 0; }
  .panel { position: absolute; inset: 0; display: none; }
  .panel.on { display: block; }
  iframe { width: 100%; height: 100%; border: 0; background: var(--bg); }
  .msg { max-width: 520px; margin: 12vh auto; padding: 24px; text-align: center; color: var(--muted); line-height: 1.5; }
  .msg h2 { margin: 0 0 8px; font-size: 18px; color: var(--ink); }
  .msg button { margin-top: 12px; padding: 9px 18px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 700; cursor: pointer; }
  .msg button:hover { background: #6D28D9; }
</style>
</head>
<body>
<header>
  <div class="brand"><img src="/logo.png" alt="" class="logo">SOCIAL <span>SOUND</span></div>
  <nav>
    <button id="t-roteiro" onclick="show('roteiro')">Roteiro</button>
    <button id="t-narracao" onclick="show('narracao')">Narração</button>
    <button id="t-dialogo" onclick="show('dialogo')">Diálogo</button>
    <button id="t-legenda" onclick="show('legenda')">Legendas</button>
    <button id="t-editor" onclick="show('editor')">Edição de vídeo</button>
  </nav>
  <div class="hint">Ctrl+1 Roteiro &nbsp;•&nbsp; Ctrl+2 Narração &nbsp;•&nbsp; Ctrl+3 Diálogo &nbsp;•&nbsp; Ctrl+4 Legendas &nbsp;•&nbsp; Ctrl+5 Edição de vídeo</div>
</header>
<main>
  <div class="panel" id="p-roteiro"></div>
  <div class="panel" id="p-narracao"></div>
  <div class="panel" id="p-dialogo"></div>
  <div class="panel" id="p-legenda"></div>
  <div class="panel" id="p-editor"></div>
</main>
<script>
  // Cada aba é uma ferramenta com o próprio servidor. A tela só carrega quando a aba é aberta pela primeira vez.
  var TABS = {
    roteiro: { url: "/roteiro/", check: false, offline: "" },
    dialogo: { url: "/dialogo/", check: false, offline: "" },
    legenda: { url: "/legenda/", check: false, offline: "" },
    narracao: { url: "/", check: false, offline: "" },
    editor: { url: "http://localhost:4000/", check: true,
      offline: "O editor de vídeo não está ligado. Se acabou de abrir o programa, espere alguns segundos e tente de novo. " +
               "Se continuar assim, confira o caminho no arquivo config.bat." }
  };
  var loaded = {};

  async function load(name) {
    var t = TABS[name], panel = document.getElementById("p-" + name);
    if (t.check) {
      try { await fetch(t.url, { mode: "no-cors" }); }
      catch (e) {
        panel.innerHTML = '<div class="msg"><h2>Editor de vídeo desligado</h2><p>' + t.offline +
          '</p><button onclick="load(\'' + name + '\')">Tentar de novo</button></div>';
        loaded[name] = false;
        return;
      }
    }
    var f = document.createElement("iframe");
    f.src = t.url;
    f.allow = "autoplay; fullscreen; clipboard-write";
    f.setAttribute("allowfullscreen", "");
    panel.replaceChildren(f);
    loaded[name] = true;
  }

  function show(name) {
    Object.keys(TABS).forEach(function (n) {
      document.getElementById("p-" + n).classList.toggle("on", n === name);
      document.getElementById("t-" + n).classList.toggle("on", n === name);
    });
    try { localStorage.setItem("aba", name); } catch (e) {}
    if (!loaded[name]) load(name);
  }

  document.addEventListener("keydown", function (e) {
    if (e.ctrlKey && e.key === "1") { e.preventDefault(); show("roteiro"); }
    if (e.ctrlKey && e.key === "2") { e.preventDefault(); show("narracao"); }
    if (e.ctrlKey && e.key === "3") { e.preventDefault(); show("dialogo"); }
    if (e.ctrlKey && e.key === "4") { e.preventDefault(); show("legenda"); }
    if (e.ctrlKey && e.key === "5") { e.preventDefault(); show("editor"); }
  });

  // "Enviar para a Narração" (aba Roteiro): o texto fica guardado no navegador e a Narração avisada
  window.addEventListener("message", function (e) {
    if (e.origin !== location.origin || !e.data || e.data.tipo !== "ir-para-narracao") return;
    var jaCarregada = !!loaded["narracao"];
    show("narracao");
    if (jaCarregada) {
      var f = document.querySelector("#p-narracao iframe");
      if (f && f.contentWindow) f.contentWindow.postMessage({ tipo: "texto-pendente" }, location.origin);
    }
  });

  var last = "roteiro";
  try { last = localStorage.getItem("aba") || last; } catch (e) {}
  show(TABS[last] ? last : "narracao");
</script>
</body>
</html>
