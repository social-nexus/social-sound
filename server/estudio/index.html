<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Social Sound</title><link rel="icon" href="/favicon.ico?v=2" sizes="any"><link rel="icon" type="image/png" href="/favicon.png?v=2"><link rel="apple-touch-icon" href="/favicon.png?v=2">
<style>
:root{color-scheme:dark;--bar:#111827;--ink:#F8FAFC;--muted:#94A3B8;--accent:#7C3AED;--bg:#080D1D;--line:rgba(148,163,184,.16)}*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Segoe UI",Roboto,sans-serif}body{display:flex;min-height:0}.sidebar{width:244px;flex:0 0 244px;display:flex;flex-direction:column;background:var(--bar);border-right:1px solid var(--line);padding:16px 12px;gap:16px}.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 12px;border-bottom:1px solid var(--line)}.brand img{width:36px;height:36px;object-fit:contain}.brand strong{font-size:17px;letter-spacing:-.02em;font-weight:900}.brand strong span{color:#A78BFA}.nav-label{padding:2px 10px;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}nav{display:flex;flex-direction:column;gap:4px}nav button{width:100%;appearance:none;display:flex;align-items:center;gap:11px;border:1px solid transparent;border-radius:10px;padding:11px 12px;background:transparent;color:var(--muted);font:600 13px system-ui,sans-serif;text-align:left;cursor:pointer;transition:background .15s,color .15s,border .15s}nav button svg{width:18px;height:18px;flex:0 0 18px}nav button:hover{background:rgba(255,255,255,.045);color:var(--ink)}nav button.on{background:rgba(124,58,237,.14);color:var(--ink);border-color:rgba(124,58,237,.28);box-shadow:inset 3px 0 0 var(--accent)}.side-foot{margin-top:auto;padding:10px;color:var(--muted);font-size:11px;line-height:1.5}main{flex:1;min-width:0;position:relative}.panel{position:absolute;inset:0;display:none}.panel.on{display:block}iframe{width:100%;height:100%;border:0;background:var(--bg)}.msg{max-width:620px;margin:12vh auto;padding:24px;text-align:center;color:var(--muted);line-height:1.6}.msg h2{margin:0 0 8px;font-size:20px;color:var(--ink)}.msg button{margin-top:12px;padding:9px 18px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}.msg button:hover{background:#6D28D9}@media(max-width:720px){body{flex-direction:column}.sidebar{width:auto;flex:0 0 auto;padding:8px;gap:6px;border-right:0;border-bottom:1px solid var(--line)}.brand{padding:3px 8px 8px}nav{flex-direction:row;overflow-x:auto;gap:3px}nav button{width:auto;white-space:nowrap;padding:9px 10px;font-size:12px}nav button.on{box-shadow:inset 0 -3px 0 var(--accent)}.nav-label,.side-foot{display:none}main{min-height:0;flex:1}}
</style></head>
<body>
<aside class="sidebar"><div class="brand"><img src="/logo.png?v=2" alt="Social Sound"><strong>SOCIAL <span>SOUND</span></strong></div><div class="nav-label">Produção</div>
<nav aria-label="Navegação principal">
<button id="t-roteiro" onclick="show('roteiro')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 2 2h12a2 2 0 0 2-2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8"/></svg>Roteiro / Humanização</button>
<button id="t-narracao" onclick="show('narracao')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5M8 22h8"/></svg>Narração</button>
<button id="t-fila" onclick="show('fila')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3" cy="6" r="1"/><circle cx="3" cy="12" r="1"/><circle cx="3" cy="18" r="1"/></svg>Fila de Narrações</button>
<button id="t-dialogo" onclick="show('dialogo')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5H5l-2 2v-5.5A8.5 8.5 0 1 1 21 11.5Z"/><path d="M8 10h8M8 14h5"/></svg>Diálogo</button>
<button id="t-legenda" onclick="show('legenda')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M7 10h4M7 14h2M14 10h3M14 14h3"/></svg>Legendas</button>
</nav>
<div class="nav-label">Inteligência Artificial</div>
<nav aria-label="Ferramentas de IA">
<button id="t-ia-roteiros" onclick="show('ia-roteiros')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/><circle cx="12" cy="12" r="5"/></svg>Roteiros e Prompts</button>
<button id="t-motores" onclick="show('motores')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2v20M5 7h14M5 17h14"/><circle cx="12" cy="7" r="2"/><circle cx="12" cy="17" r="2"/></svg>Motores de Voz</button>
<button id="t-ia-config" onclick="show('ia-config')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.2 2.1-2 2-2.1-1.2-.2.1a8 8 0 0 1-1.6.7l-.3 2.3h-2.8l-.3-2.3a8 8 0 0 1-1.6-.7l-.2-.1-2.1 1.2-2-2 1.2-2.1.1-.2a8 8 0 0 1-.7-1.6L3 13.1v-2.8l2.3-.3a8 8 0 0 1 .7-1.6l-.1-.2-1.2-2.1 2-2 2.1 1.2.2-.1a8 8 0 0 1 1.6-.7L10.9 2h2.8l.3 2.3a8 8 0 0 1 1.6.7l.2.1 2.1-1.2 2 2-1.2 2.1-.1.2a8 8 0 0 1 .7 1.6l2.3.3v2.8l-2.3.3a8 8 0 0 1-.7 1.6Z"/></svg>Configurações de IA</button>
<button id="t-ia-prompts" onclick="show('ia-prompts')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>Prompts Visuais</button>
</nav><div class="side-foot">Social Sound · ferramentas locais de criação de conteúdo</div></aside>
<main><div class="panel" id="p-roteiro"></div><div class="panel" id="p-narracao"></div><div class="panel" id="p-fila"></div><div class="panel" id="p-dialogo"></div><div class="panel" id="p-legenda"></div><div class="panel" id="p-ia-roteiros"></div><div class="panel" id="p-motores"></div><div class="panel" id="p-ia-config"></div><div class="panel" id="p-ia-prompts"></div></main>
<script>
var TABS={roteiro:{url:"/roteiro/"},narracao:{url:"/"},fila:{url:"/narracoes/"},dialogo:{url:"/dialogo/"},legenda:{url:"/legenda/"},"ia-roteiros":{url:"/ia-roteiros/"},"motores":{url:"/motores/"},"ia-config":{url:"/ia-config/"},"ia-prompts":{url:"/ia-prompts/"}};
var loaded={};
function load(name){var t=TABS[name],panel=document.getElementById("p-"+name);if(t.offline){panel.innerHTML='<div class="msg"><h2>Em desenvolvimento</h2><p>'+t.offline+'</p></div>';loaded[name]=true;return;}var f=document.createElement("iframe");f.src=t.url;f.allow="autoplay; fullscreen; clipboard-write";f.setAttribute("allowfullscreen","");if(name==="ia-config"){f.addEventListener("load",function(){try{var d=f.contentDocument;var s=d.createElement("style");s.textContent=".main-col{display:none!important}.wrap{display:block!important;max-width:1100px!important}.side-col{display:block!important;max-width:none!important}.side-col>.card{margin-bottom:16px}";d.head.appendChild(s);var h=d.querySelector("header h1");if(h)h.textContent="Configurações de IA";var sub=d.querySelector("header p");if(sub)sub.textContent="Configure provedores externos, chaves API e modelos locais em um espaço separado."; }catch(e){}});}panel.replaceChildren(f);loaded[name]=true;}
function show(name){Object.keys(TABS).forEach(function(n){document.getElementById("p-"+n).classList.toggle("on",n===name);document.getElementById("t-"+n).classList.toggle("on",n===name);});try{localStorage.setItem("aba",name);}catch(e){}if(!loaded[name])load(name);}
document.addEventListener("keydown",function(e){if(!e.ctrlKey)return;var keys={"1":"roteiro","2":"narracao","3":"dialogo","4":"legenda","5":"ia-roteiros","6":"ia-prompts","7":"fila","8":"motores","9":"ia-config"};if(keys[e.key]){e.preventDefault();show(keys[e.key]);}});
window.addEventListener("message",function(e){if(e.origin!==location.origin||!e.data||e.data.tipo!=="ir-para-narracao")return;var loadedNarration=!!loaded.narracao;show("narracao");if(loadedNarration){var f=document.querySelector("#p-narracao iframe");if(f&&f.contentWindow)f.contentWindow.postMessage({tipo:"texto-pendente"},location.origin);}});
var last="roteiro";try{last=localStorage.getItem("aba")||last;}catch(e){}show(TABS[last]?last:"roteiro");
</script></body></html>
